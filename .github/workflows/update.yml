name: Update calendar
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_ics.py docs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          # DTSTAMP changes every run; only commit when event content changed
          if git diff --cached -U0 -- docs | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)|DTSTAMP' | grep -q .; then
            git commit -m "Update calendar" && git push
          else
            git reset -q
          fi
